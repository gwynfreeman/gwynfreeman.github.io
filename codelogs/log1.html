<h1>Code Log 1: HTML Semantic Tags</h1>
 <h2>Semantic Tags </h2>
<textarea cols="50" rows="10">
Semantic tags describe what content is contained within a tag. 
Semantic tags can make code easier to read. 
Search engines rely on semantic tags to determine the importance of each part of the page.
Example: <header> Tells us that this information will introduce more information in the following tags.
    <p> Tells us this is a paragraph.

 
</textarea>
   <h2> Non-Semantic Tags</h2>
<textarea cols="50" rows="10">
Non-semantic tags do not describe the content that is contained within a tag. 
Non-semantic tags may be harder to read, but can be useful when no semantic tags fit.
They are used as a general container to group elements or apply syles and scripts. 
Example: A <div> can be used for anything: text, images, forms, or entire layout sections, but the purpose must be inferred from class names, IDs, or context.


</textarea>
  <h2> Benefits of Semantic Tags</h2>
<textarea cols="100" rows="10">
There are many benefits to using semantic HTML tags.  
The first benefit of using semantic tags is that they can improve accessibility for users who rely on assistive technologies such as screen readers. This is because semantic tags communicate the purpose of each section, screen readers can interpret the structure of a webpage more accurately. This allows users with visual impairments to navigate content in a logical, meaningful order rather than having to guess the function of generic containers.
The second benefit of using semantic tags is that search engines analyze webpages to determine what content is most important, how information is organized, and how relevant a page is to a user's search.  When we use semantic elements, we give search engines clear signals about the hierarchy and meaning of the content.
