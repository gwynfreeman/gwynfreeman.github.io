    <h1>Code Log 2: CSS Measuring Units</h1>
    <h2>Measuring Units </h2>
    <textarea cols="100" rows="6">
In CSS, length units define the distances for properties like font-size, width, padding, and margin. Absolute lengths remain constant regardless of screen size and parent element dimensions. Relative lengths change depending on another measurement such as screen size or parent element dimensions. PX and PT are absolute, and EM and REM are relative.

 
</textarea>
    <h2> px and pt</h2>
    <textarea cols="100" rows="10">
px: In CSS, px means pixels this is used to determine font sizes, margins, paddings, borders, and element dimensions. PX is considered absolute, but it's size is dependent on the device size. PX ensures exact sizing regardless of the user’s font settings. PX is ideal for fixed, sharp, and predictable sizing.
    Example: font-size 16px; margin-bottom: 20px; 

pt: In CSS, pt stands for points, one point is equal to 1/72 of an inch. PT is a fixed unit, meaning it represents a fixed size. 
    Example: font-size: 12pt;



</textarea>
    <h2> em and rem</h2>
    <textarea cols="100" rows="20">
em: In CSS, em is relative to the font size of the element’s parent when used for font-size, and relative to the element’s own font size for other properties. This means nested elements can compound sizes, leading to unexpected scaling if not managed carefully.
        Example: <style>
        .parent {
        font-size: 20px;
        }
        .child {
        font-size: 2em; /* 2 * 20px = 40px */
        }
        </style>
        <div class="parent">
        Parent Text
        <div class="child">Child Text</div>
        </div>
The child inherits the parent's font-size of 20px and multiplies it by 2, so the font-size will be 40px.


rem: In CSS, rem stands for root em and is relative to the font size of the root element (<html>). It provides consistent sizing across the document, unaffected by nesting.
    Example: <style>
    html {
   font-size: 16px;
    }
    .child {
   font-size: 2rem; /* 2 * 16px = 32px */
    }
    </style>
    <div class="child">Child Text</div>
The child's font-size will always be 32px regardless of the parent's font size.
