<textarea cols="50" rows="10">
Semantic tags describe what content is contained within a tag. 
Semantic tags can make code easier to read. 
Search engines rely on semantic tags to determine the importance of each part of the page.


</textarea>
<textarea cols="50" rows="10">
Non-semantic tags do not describe the content that is contained within a tag. 
Non-semantic tags may be harder to read, but can be useful when no semantic tags fit.
They are used as a general container to group elements or apply syles and scripts. 
Example: A <div> can be used for anything: text, images, forms, or entire layout sections, but the purpose must be inferred from class names, IDs, or context.


</textarea>
